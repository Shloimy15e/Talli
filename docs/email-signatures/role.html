<!-- Shared role signature. Replace {{role}} and {{email}} with escaped profile values. -->
<style>
  @media only screen and (max-width:480px) {
    .dynamiq-email-signature .dynamiq-email-signature__logo { display:block !important; width:100% !important; max-width:100% !important; height:44px !important; overflow:hidden !important; }
    .dynamiq-email-signature .dynamiq-email-signature__logo img { margin-top:-36px !important; }
    .dynamiq-email-signature .dynamiq-email-signature__spacer { display:none !important; width:0 !important; height:0 !important; }
    .dynamiq-email-signature .dynamiq-email-signature__contact { display:inline-block !important; width:auto !important; max-width:100% !important; margin:14px 0 0 10px !important; padding:13px 0 0 !important; border-left:0 !important; border-top:1px solid #ea7c28 !important; }
  }
</style>
<!-- installable-signature:start -->
<table class="dynamiq-email-signature" role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;max-width:460px;border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;color:#141c34;">
  <tr>
    <td style="padding:0 0 12px;font-size:13px;line-height:19px;color:#637083;">Kind regards,</td>
  </tr>
  <tr>
    <td class="dynamiq-email-signature__layout" style="padding:0;font-size:0;line-height:0;text-align:left;">
      <div class="dynamiq-email-signature__logo" style="display:inline-block;box-sizing:border-box;width:170px;max-width:100%;padding:0 10px 0 0;vertical-align:middle;">
        <a href="https://dynamiq.dev" target="_blank" style="text-decoration:none;">
          <img src="https://lh3.googleusercontent.com/d/1lfKgLhKID6PZSIddPdfC6R_p7XwnE8Qu" width="160" alt="Dynamiq Solutions" style="display:block;width:160px;max-width:100%;height:auto;border:0;">
        </a>
      </div><span class="dynamiq-email-signature__spacer" style="display:inline-block;width:14px;height:1px;font-size:1px;line-height:1px;vertical-align:middle;">&nbsp;</span><div class="dynamiq-email-signature__contact" style="display:inline-block;box-sizing:border-box;width:245px;max-width:100%;padding-left:14px;border-left:1px solid #ea7c28;vertical-align:middle;text-align:left;font-size:12px;line-height:20px;">
        <div style="margin:0;font-size:13px;line-height:20px;font-weight:500;color:#637083;">{{role}}</div>
        <div style="font-size:12px;line-height:20px;"><a href="mailto:{{email}}" style="display:inline-block;max-width:100%;color:#3f4b5e;text-decoration:none;white-space:nowrap;">{{email}}</a></div>
        <div style="font-size:12px;line-height:20px;"><a href="https://dynamiq.dev" target="_blank" style="display:inline-block;color:#ea7c28;text-decoration:none;white-space:nowrap;">dynamiq.dev</a></div>
      </div>
    </td>
  </tr>
</table>
<!-- installable-signature:end -->
