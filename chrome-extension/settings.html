<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Talli - Connection settings</title><link rel="stylesheet" href="assets/design-tokens.css"><link rel="stylesheet" href="assets/select.css"><link rel="stylesheet" href="styles.css"></head>
<body><header class="header"><img class="header-wordmark" src="assets/wordmark.svg" alt="Talli"><span class="header-title">Connection</span><button class="header-btn" id="backBtn">Back</button></header>
<main class="settings-page"><h1>Connect to Talli</h1><p class="intro">Use your Talli server and an API token from the app's Settings. Your token stays in this browser's local extension storage.</p>
<div id="feedback" class="feedback" role="status" aria-live="polite"></div>
<div class="field-group"><label for="serverUrl">Server URL</label><input type="url" id="serverUrl" placeholder="https://talli.example.com" autocomplete="url"><p class="field-help">Use HTTPS. Local development also supports http://localhost.</p></div>
<div class="field-group"><label for="apiToken">API token</label><input type="password" id="apiToken" placeholder="Paste your API token" autocomplete="off" spellcheck="false"><p class="field-help">Unsaved token edits are cleared when this popup closes.</p></div>
<div class="settings-footer"><button class="btn btn-secondary" id="testBtn">Test connection</button><button class="btn btn-primary" id="saveBtn">Save connection</button></div>
<div id="connectionStatus" class="connection-status" role="status" aria-live="polite"></div>
<button id="disconnectBtn" class="text-button disconnect">Disconnect and remove token</button>
</main><script src="assets/select.js"></script><script src="api.js"></script><script src="settings.js"></script></body></html>
