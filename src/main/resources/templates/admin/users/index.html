<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layout :: head('Users')}"></head>
  <body th:replace="~{layout :: page('users', ~{::section})}">
    <section>

      <div class="flex items-center justify-between mb-8">
        <div>
          <h1 class="text-2xl font-semibold tracking-tight">Users</h1>
          <p class="text-sm text-slate-500 mt-1"
             th:text="${#lists.size(users)} + ' user' + (${#lists.size(users)} == 1 ? '' : 's')">0 users</p>
        </div>
        <button hx-get="/admin/users/invite" hx-target="#modal" hx-swap="innerHTML"
                class="inline-flex items-center gap-2 bg-ui-accent hover:bg-ui-accent-hover text-ui-accent-foreground text-sm font-medium px-4 py-2 rounded-lg transition">
          <i data-lucide="plus" class="w-4 h-4"></i>
          Invite user
        </button>
      </div>

      <!-- Flash -->
      <div th:if="${success}" class="mb-6 px-4 py-3 rounded-lg bg-emerald-50 border border-emerald-200 text-sm text-emerald-800"
           th:text="${success}">ok</div>
      <div th:if="${error}" class="mb-6 px-4 py-3 rounded-lg bg-red-50 border border-red-200 text-sm text-red-800"
           th:text="${error}">error</div>

      <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
        <div class="overflow-x-auto">
        <table class="w-full min-w-[640px]">
          <thead>
            <tr class="border-b border-slate-200">
              <th class="text-left text-xs font-semibold text-slate-500 uppercase tracking-wider px-6 py-3">Name</th>
              <th class="text-left text-xs font-semibold text-slate-500 uppercase tracking-wider px-6 py-3">Email</th>
              <th class="text-left text-xs font-semibold text-slate-500 uppercase tracking-wider px-6 py-3">Roles</th>
              <th class="text-left text-xs font-semibold text-slate-500 uppercase tracking-wider px-6 py-3">Status</th>
              <th class="px-6 py-3 app-row-actions-cell" style="--app-row-action-count: 4" aria-label="Actions"></th>
            </tr>
          </thead>
          <tbody>
            <tr data-row-action th:each="u : ${users}" class="border-b border-slate-100 hover:bg-slate-50 transition group">
              <td class="px-6 py-4 font-medium" th:text="${u.name}">Name</td>
              <td class="px-6 py-4 text-slate-600 text-sm" th:text="${u.email}">email</td>
              <td class="px-6 py-4">
                <span th:each="r : ${u.roles}"
                      class="app-status capitalize mr-1"
                      th:classappend="${r.name == 'admin' ? 'app-status-neutral' : (r.name == 'client' ? 'app-status-neutral' : 'app-status-neutral')}"
                      th:text="${r.name}">role</span>
              </td>
              <td class="px-6 py-4">
                <span th:if="${u.inviteToken != null}"
                      class="app-status app-status-warning ">Pending invite</span>
                <span th:if="${u.inviteToken == null and u.enabled}"
                      class="app-status app-status-success ">Active</span>
                <span th:if="${u.inviteToken == null and !u.enabled}"
                      class="app-status app-status-danger ">Disabled</span>
              </td>
              <td class="px-6 py-4 text-right app-row-actions-cell" style="--app-row-action-count: 4">
                <div class="app-row-actions">
                  <button th:hx-get="@{/admin/users/{id}/edit(id=${u.id})}"
                          hx-target="#modal" hx-swap="innerHTML"
                          type="button" title="Edit user" aria-label="Edit user" class="app-icon-button" data-row-primary><i data-lucide="pencil" aria-hidden="true"></i></button>
                  <form th:if="${u.inviteToken != null}"
                        th:action="@{/admin/users/{id}/resend-invite(id=${u.id})}" method="post" class="inline">
                    <button type="submit" title="Resend invitation" aria-label="Resend invitation" class="app-icon-button"><i data-lucide="send" aria-hidden="true"></i></button>
                  </form>
                  <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post" class="inline">
                    <button type="submit"

                            th:title="${u.enabled} ? 'Disable user' : 'Enable user'" th:aria-label="${u.enabled} ? 'Disable user' : 'Enable user'" class="app-icon-button"><i data-lucide="power" aria-hidden="true"></i></button>
                  </form>
                  <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post" class="inline"
                        onsubmit="return confirm('Delete this user?')">
                    <button type="submit" title="Delete user" aria-label="Delete user" class="app-icon-button app-icon-button-danger"><i data-lucide="trash-2" aria-hidden="true"></i></button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
        </div>
      </div>

    </section>
  </body>
</html>
