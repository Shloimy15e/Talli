<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layout :: head('Edit sender profile')}"></head>
  <body th:replace="~{layout :: page('sender-profiles', ~{::section})}">
    <section class="max-w-3xl">
      <a th:href="@{/emails/senders}"
         class="inline-flex items-center gap-1.5 text-sm text-slate-500 hover:text-slate-900 mb-5">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        Sender profiles
      </a>
      <div class="mb-8">
        <h1 class="text-2xl font-semibold tracking-tight">Edit sender profile</h1>
        <p class="text-sm text-slate-500 mt-1">Changes apply to new messages and agent sender choices.</p>
      </div>

      <div th:if="${error}"
           class="mb-6 px-4 py-3 rounded-lg bg-red-50 border border-red-200 text-sm text-red-800"
           th:text="${error}">Could not save.</div>

      <form th:action="@{/emails/senders/{id}(id=${profile.id})}" method="post"
            class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="p-6 sm:p-8 space-y-6">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <div>
              <label for="name" class="block text-sm font-medium text-slate-700 mb-1.5">Display name</label>
              <input id="name" name="name" type="text" required maxlength="200" autocomplete="off"
                     th:value="${draft != null ? draft.name : profile.name}"
                     class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#ea7c28]/30 focus:border-[#ea7c28]" />
            </div>
            <div>
              <label for="address" class="block text-sm font-medium text-slate-700 mb-1.5">Email address</label>
              <input id="address" name="address" type="email" required maxlength="320" autocomplete="off"
                     th:value="${draft != null ? draft.address : profile.address}"
                     class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#ea7c28]/30 focus:border-[#ea7c28]" />
            </div>
          </div>
          <div>
            <div class="flex items-baseline justify-between gap-3 mb-1.5">
              <label for="signature" class="block text-sm font-medium text-slate-700">Signature HTML</label>
              <span class="text-xs text-slate-400">Blank restores the basic signature</span>
            </div>
            <input type="hidden" name="signatureFormat" value="html" />
            <textarea id="signature" name="signatureHtml" rows="12" maxlength="100000" data-signature-editor
                      th:text="${draft != null ? draft.signatureHtml : profile.signatureHtml}"
                      class="w-full rounded-lg border border-slate-300 px-3 py-2 font-mono text-xs leading-5 focus:outline-none focus:ring-2 focus:ring-[#ea7c28]/30 focus:border-[#ea7c28]"></textarea>
            <div class="flex items-start justify-between gap-4 mt-1.5">
              <p class="text-xs text-slate-500">HTML is stored for email delivery and shown in an isolated preview.</p>
              <button type="button"
                      data-html-preview-trigger
                      aria-haspopup="dialog"
                      aria-controls="html-preview-dialog"
                      data-html-preview-title="Signature preview"
                      th:data-html-preview-subtitle="${profile.address}"
                      data-html-preview-source="#signature"
                      class="inline-flex shrink-0 items-center gap-1.5 text-xs font-medium text-slate-600 hover:text-slate-950">
                <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                Preview
              </button>
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 rounded-lg border border-slate-200 bg-slate-50 p-4">
            <label class="flex items-start gap-3 cursor-pointer">
              <input th:if="${profile.defaultSender}" type="hidden" name="active" value="true" />
              <input type="checkbox" name="active" value="true"
                     th:checked="${draft != null ? draft.active : profile.active}"
                     th:disabled="${profile.defaultSender}"
                     class="mt-0.5 rounded border-slate-300 text-[#ea7c28] focus:ring-[#ea7c28]" />
              <span>
                <span class="block text-sm font-medium text-slate-700">Active</span>
                <span class="block text-xs text-slate-500 mt-0.5"
                      th:text="${profile.defaultSender} ? 'Choose another default before disabling.' : 'Available for new outgoing messages.'">Available for new messages.</span>
              </span>
            </label>
            <label class="flex items-start gap-3 cursor-pointer">
              <input type="checkbox" name="defaultSender" value="true"
                     th:checked="${draft != null ? draft.defaultSender : profile.defaultSender}"
                     th:disabled="${profile.defaultSender}"
                     class="mt-0.5 rounded border-slate-300 text-[#ea7c28] focus:ring-[#ea7c28]" />
              <span>
                <span class="block text-sm font-medium text-slate-700">Default sender</span>
                <span class="block text-xs text-slate-500 mt-0.5"
                      th:text="${profile.defaultSender} ? 'Choose another profile to replace this default.' : 'Make this the fallback sender.'">Make this the fallback sender.</span>
              </span>
            </label>
          </div>
        </div>
        <div class="flex items-center justify-end gap-3 border-t border-slate-200 bg-slate-50 px-6 py-4 sm:px-8">
          <a th:href="@{/emails/senders}" class="text-sm font-medium text-slate-600 hover:text-slate-900">Cancel</a>
          <button type="submit"
                  class="inline-flex items-center gap-2 rounded-lg bg-[#ea7c28] px-4 py-2 text-sm font-medium text-white hover:bg-[#d66f20] focus:outline-none focus:ring-2 focus:ring-[#ea7c28]/40">
            Save changes
          </button>
        </div>
      </form>
      <div th:replace="~{fragments/html-preview :: dialog}"></div>
      <script src="/js/ui/html-preview.js" th:src="@{/js/ui/html-preview.js}" defer></script>
    </section>
  </body>
</html>
