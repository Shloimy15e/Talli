<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <th:block th:fragment="reader">
    <header class="mail-reader-toolbar">
      <a th:href="@{/emails(folder=${folder},mailboxAddress=${mailboxAddress},search=${search},page=${mailRows.number})}" class="mail-icon-button" aria-label="Back to conversations" title="Back to conversations"><i data-lucide="arrow-left"></i></a>
      <div class="mail-toolbar-actions">
        <form th:action="@{/emails/{id}/mailbox(id=${selectedEmail.id})}" method="post" hx-boost="true" hx-target="#mail-workspace" hx-select="#mail-workspace" hx-swap="outerHTML">
          <input type="hidden" name="action" th:value="${selectedArchived ? 'unarchive' : 'archive'}"/><input type="hidden" name="mailboxAddress" th:value="${mailboxAddress}"/><input type="hidden" name="folder" th:value="${folder}"/><input type="hidden" name="search" th:value="${search}"/><input type="hidden" name="page" th:value="${mailRows.number}"/>
          <button type="submit" class="mail-icon-button" th:title="${selectedArchived ? 'Move to inbox' : 'Archive conversation'}" th:attr="aria-label=${selectedArchived ? 'Move to inbox' : 'Archive conversation'}"><i th:attr="data-lucide=${selectedArchived ? 'archive-restore' : 'archive'}"></i></button>
        </form>
        <form th:action="@{/emails/{id}/mailbox(id=${selectedEmail.id})}" method="post" hx-boost="true" hx-target="#mail-workspace" hx-select="#mail-workspace" hx-swap="outerHTML">
          <input type="hidden" name="action" value="unread"/><input type="hidden" name="mailboxAddress" th:value="${mailboxAddress}"/><input type="hidden" name="folder" th:value="${folder}"/><input type="hidden" name="search" th:value="${search}"/><input type="hidden" name="page" th:value="${mailRows.number}"/>
          <button type="submit" class="mail-icon-button" aria-label="Mark as unread" title="Mark as unread"><i data-lucide="mail"></i></button>
        </form>
        <form th:action="@{/emails/{id}/mailbox(id=${selectedEmail.id})}" method="post" hx-boost="true" hx-target="#mail-workspace" hx-select="#mail-workspace" hx-swap="outerHTML">
          <input type="hidden" name="action" th:value="${selectedStarred ? 'unstar' : 'star'}"/><input type="hidden" name="mailboxAddress" th:value="${mailboxAddress}"/><input type="hidden" name="folder" th:value="${folder}"/><input type="hidden" name="search" th:value="${search}"/><input type="hidden" name="page" th:value="${mailRows.number}"/><input type="hidden" name="returnToConversation" value="true"/>
          <button type="submit" class="mail-icon-button mail-star" th:classappend="${selectedStarred} ? 'is-starred' : ''" th:attr="aria-label=${selectedStarred ? 'Unstar conversation' : 'Star conversation'},aria-pressed=${selectedStarred}" title="Star conversation"><i data-lucide="star"></i></button>
        </form>
      </div>
      <button th:if="${replyId != null}" type="button" class="mail-icon-button mail-toolbar-reply" th:attr="hx-get=@{/emails/new(replyToEmailId=${replyId},mailboxAddress=${mailboxAddress})}" hx-target="#reply-composer" hx-swap="innerHTML" aria-label="Reply to conversation" title="Reply"><i data-lucide="reply"></i></button>
    </header>
    <div class="mail-reader-scroll">
      <div class="mail-conversation-heading">
        <h2 th:text="${selectedEmail.subject.isBlank() ? '(No subject)' : selectedEmail.subject}">Subject</h2>
        <div class="mail-conversation-context"><span th:text="${#lists.size(conversation) + ' message' + (#lists.size(conversation) == 1 ? '' : 's')}">3 messages</span><a th:if="${selectedEmail.client != null}" th:href="@{/clients/{id}(id=${selectedEmail.client.id})}" th:text="${selectedEmail.client.name}">Client</a><a th:if="${selectedEmail.invoice != null}" th:href="@{/invoices/{id}(id=${selectedEmail.invoice.id})}">View invoice<i data-lucide="arrow-up-right"></i></a><button type="button" class="mail-expand-all" data-expand-messages>Expand all</button></div>
      </div>
      <div class="mail-messages" aria-label="Conversation">
        <details th:each="message, loop : ${conversation}" class="mail-message" th:open="${loop.last or message.id == selectedEmail.id}" th:attr="data-message-id=${message.id}">
          <summary class="mail-message-summary">
            <span class="mail-avatar" th:classappend="${message.direction == 'out'} ? 'is-team' : ''"><i th:attr="data-lucide=${message.direction == 'out' ? 'building-2' : 'user-round'}"></i></span>
            <span class="mail-message-heading"><span class="mail-message-sender" th:text="${message.fromAddress != null ? message.fromAddress : 'Your team'}">Sender</span><span class="mail-message-preview" th:text="${message.body}">Message</span><span class="mail-message-to" th:text="'to ' + ${message.toAddress}">to you</span></span>
            <span class="mail-message-time"><span th:replace="~{fragments/_time :: datetime(${message.sentAt != null ? message.sentAt : message.createdAt}, 'short')}"></span><i data-lucide="chevron-down"></i></span>
          </summary>
          <div class="mail-message-content">
            <details class="mail-message-details"><summary>Message details<i data-lucide="chevron-down"></i></summary><dl><dt>From</dt><dd th:text="${message.fromAddress ?: 'Not recorded'}"></dd><dt>To</dt><dd th:text="${message.toAddress}"></dd><th:block th:if="${message.cc != null}"><dt>Cc</dt><dd th:text="${message.cc}"></dd></th:block><th:block th:if="${message.bcc != null}"><dt>Bcc</dt><dd th:text="${message.bcc}"></dd></th:block><dt>Subject</dt><dd th:text="${message.subject}"></dd><dt>Status</dt><dd th:text="${message.status}"></dd><th:block th:if="${message.deliveredAt != null}"><dt>Delivered</dt><dd><span th:replace="~{fragments/_time :: datetime(${message.deliveredAt}, 'short')}"></span></dd></th:block><th:block th:if="${message.openedAt != null}"><dt>Opened</dt><dd><span th:replace="~{fragments/_time :: datetime(${message.openedAt}, 'short')}"></span></dd></th:block><th:block th:if="${message.resendId != null}"><dt>Provider reference</dt><dd th:text="${message.resendId}"></dd></th:block></dl></details>
            <div th:if="${message.status == 'failed'}" class="mail-delivery-warning"><i data-lucide="circle-alert"></i><div><strong>This message wasn’t sent.</strong><p th:text="${message.errorMessage ?: 'Please check the message and try again.'}"></p></div></div>
            <div th:if="${message.bounceReason != null}" class="mail-delivery-warning"><i data-lucide="circle-alert"></i><div><strong>This message couldn’t be delivered.</strong><p th:text="${message.bounceReason}"></p></div></div>
            <iframe th:if="${message.bodyHtml != null}" class="mail-message-frame" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer" th:attr="srcdoc=${message.bodyHtml},title='Message from ' + ${message.fromAddress ?: 'your team'}"></iframe>
            <div th:if="${message.bodyHtml == null}" class="mail-message-plain" th:text="${message.body}"></div>
            <div class="mail-attachments" th:if="${attachmentsByEmailId != null and attachmentsByEmailId[message.id] != null and !#lists.isEmpty(attachmentsByEmailId[message.id])}"><a th:each="attachment : ${attachmentsByEmailId[message.id]}" th:href="@{/media/{id}(id=${attachment.id})}" target="_blank" rel="noopener" class="mail-attachment"><i data-lucide="paperclip"></i><span><strong th:text="${attachment.filename}"></strong><small th:text="${#numbers.formatDecimal(attachment.sizeBytes / 1024.0, 1, 'COMMA', 1, 'POINT')} + ' KB'"></small></span><i data-lucide="arrow-down-to-line"></i></a></div>
          </div>
        </details>
      </div>
      <div class="mail-reply-area">
        <div id="reply-composer"></div>
        <button th:if="${replyId != null}" type="button" class="mail-reply-prompt" th:attr="hx-get=@{/emails/new(replyToEmailId=${replyId},mailboxAddress=${mailboxAddress})}" hx-target="#reply-composer" hx-swap="innerHTML"><i data-lucide="reply"></i><span>Reply to this conversation</span><kbd>R</kbd></button>
        <div th:if="${replyId == null}" class="mail-legacy-reply"><p th:text="${replyUnavailableReason}">This saved conversation does not have a valid reply recipient.</p><button type="button" class="mail-secondary-button" th:attr="hx-get=@{/emails/new(mailboxAddress=${mailboxAddress})}" hx-target="#modal" hx-swap="innerHTML"><i data-lucide="square-pen"></i>Write a new message</button></div>
      </div>
    </div>
  </th:block>
</body>
</html>
