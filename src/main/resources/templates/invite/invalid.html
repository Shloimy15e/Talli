<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Invitation unavailable')}"></head>
<body class="auth-page bg-slate-100 min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="flex items-center gap-2 justify-center mb-3">
        <img src="/brand/dynamiq-icon.svg" alt="Dynamiq" class="w-9 h-9" />
        <span class="text-xl font-semibold">Talli</span>
      </div>
      <h1 class="text-xl font-semibold tracking-tight">Invite link unavailable</h1>
      <p class="text-sm text-slate-500 mt-1">Ask your administrator to send a new invitation.</p>
    </div>

    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 text-center">
      <div class="mb-5 px-4 py-3 rounded-lg bg-red-50 border border-red-200 text-sm text-red-800"
           th:text="${error}">This invite link is invalid, expired, or has already been used.</div>

      <a href="/login"
         class="inline-flex items-center justify-center w-full bg-ui-accent hover:bg-ui-accent-hover text-ui-accent-foreground text-sm font-medium py-2.5 rounded-lg transition">
        Go to login
      </a>
    </div>

    <div class="auth-attribution"><img src="/brand/dynamiq-horizontal.svg" alt="Dynamiq"/></div>
  </div>

</body>
</html>
