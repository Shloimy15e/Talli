<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invite link unavailable - Talli</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="flex items-center gap-2 justify-center mb-3">
        <img src="/logo.svg" alt="Talli" class="w-9 h-9" />
        <span class="text-xl font-semibold">Talli</span>
      </div>
      <h1 class="text-xl font-semibold tracking-tight">Invite link unavailable</h1>
      <p class="text-sm text-slate-500 mt-1">Ask your administrator to send a new invitation.</p>
    </div>

    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 text-center">
      <div class="mb-5 px-4 py-3 rounded-lg bg-red-50 border border-red-200 text-sm text-red-800"
           th:text="${error}">This invite link is invalid, expired, or has already been used.</div>

      <a href="/login"
         class="inline-flex items-center justify-center w-full bg-[#ea7c28] hover:bg-[#d66f20] text-white text-sm font-medium py-2.5 rounded-lg transition">
        Go to login
      </a>
    </div>

    <p class="text-center text-xs text-slate-400 mt-6">Dynamiq Solutions</p>
  </div>

</body>
</html>
