<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <!-- Fragment 1: head (just the <head>) -->
  <head th:fragment="head(title)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title th:text="${title}">Talli</title>
    <link rel="icon" href="/logo.svg" th:href="@{/logo.svg}" type="image/svg+xml" />
    <script>
      try {
        if (localStorage.getItem('talli.sidebar.collapsed') === 'true') {
          document.documentElement.dataset.sidebarCollapsed = 'true';
        }
      } catch (error) {}
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <script th:if="${@environment.acceptsProfiles('local')}" th:src="@{/js/dev-reload.js}" defer></script>
    <script defer src="/js/app-shell.js" th:src="@{/js/app-shell.js}"></script>
    <script defer src="/js/mail-composer.js" th:src="@{/js/mail-composer.js}"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <script defer src="/js/ui/select.js" th:src="@{/js/ui/select.js}"></script>

    <!-- Lucide icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <!-- Tippy.js for tooltips -->
    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <script src="https://unpkg.com/tippy.js@6"></script>
    <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/themes/light-border.css" />

    <!-- Device-local datetime + timeago rendering (must load before Tippy init
         so data-tippy-content is populated in device tz before tooltips attach). -->
    <script src="/js/time.js" th:src="@{/js/time.js}"></script>
    <link rel="stylesheet" href="/css/design-tokens.css" th:href="@{/css/design-tokens.css}" />
    <link rel="stylesheet" href="/css/app.css" th:href="@{/css/app.css}" />
    <link rel="stylesheet" href="/css/mail.css" th:href="@{/css/mail.css}" />
    <link rel="stylesheet" href="/css/mail-composer.css" th:href="@{/css/mail-composer.css}" />
    <link rel="stylesheet" href="/css/ui/select.css" th:href="@{/css/ui/select.css}" />
    <style id="email-signature-styles"
           th:text="${@emailTemplateCatalog.signatureStyles()}"></style>

    <script defer src="/js/mail.js" th:src="@{/js/mail.js}"></script>
    <script>
      function initTooltips() {
        if (window.tippy) {
          tippy('[data-tippy-content]', {
            theme: 'light-border',
            arrow: true,
            animation: 'shift-away',
            delay: [200, 0],
          });
        }
      }
      function initLucide() { if (window.lucide) lucide.createIcons(); }
      document.addEventListener('DOMContentLoaded', () => {
        if (window.renderTimes) window.renderTimes();
        initTooltips();
        initLucide();
      });
      document.addEventListener('htmx:afterSwap', (e) => {
        if (window.renderTimes) window.renderTimes(e.target);
        initTooltips();
        initLucide();
      });
    </script>

    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />

    <style>
      html {
        font-family: "Inter", sans-serif;
      }
      @supports (font-variation-settings: normal) {
        html {
          font-family: "Inter var", sans-serif;
        }
      }
      [x-cloak] {
        display: none !important;
      }
    </style>
  </head>

  <!-- Fragment 2: page — the full body shell with sidebar + content slot
     Pass (active, content) and the page's content gets injected where we put ${content} -->
  <body
    th:fragment="page(active, content)"
    class="app-shell"
    x-data="{ modalOpen: false }"
    @close-modal.window="modalOpen = false; setTimeout(() => document.getElementById('modal').innerHTML = '', 180)"
    @htmx:after-swap.window="if ($event.detail.target.id === 'modal') modalOpen = true"
  >
    <th:block th:replace="~{fragments/sidebar :: sidebar(${active})}"></th:block>

    <main class="app-main">
      <div class="app-content">
        <div th:replace="${content}"></div>
      </div>
    </main>

    <!-- Modal mount point — shared across all pages -->
    <div id="modal"
         class="app-modal-host"
         x-show="modalOpen"
         x-transition:enter="ease-out duration-[180ms]"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="ease-in duration-[180ms]"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         x-cloak></div>
  </body>

  <body th:fragment="mail(content)" class="app-shell mail-app"
        x-data="{ modalOpen: false }"
        @close-modal.window="modalOpen = false; setTimeout(() => document.getElementById('modal').innerHTML = '', 180)"
        @htmx:after-swap.window="if ($event.detail.target.id === 'modal') modalOpen = true">
    <th:block th:replace="~{fragments/sidebar :: sidebar('emails')}"></th:block>
    <main class="app-main mail-main"><th:block th:replace="${content}"></th:block></main>
    <div id="modal"
         class="app-modal-host"
         x-show="modalOpen"
         x-transition:enter="ease-out duration-[180ms]"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="ease-in duration-[180ms]"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         x-cloak></div>
  </body>
</html>
