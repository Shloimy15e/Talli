<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{layout :: head('Sign in · Talli')}"></head>
  <body class="auth-page">
    <div class="auth-shell">

      <div class="auth-brand">
        <img src="/brand/talli-wordmark-color.svg" th:src="@{/brand/talli-wordmark-color.svg}" alt="Talli" width="184" height="48" />
      </div>

      <div class="auth-card">
        <h1 class="auth-title">Sign in</h1>

        <div th:if="${param.error}"
             class="auth-notice is-error">
          Wrong email or password.
        </div>
        <div th:if="${param['logged-out']}"
             class="auth-notice is-success">
          You've been signed out.
        </div>

        <form th:action="@{/login}" method="post" class="auth-form">
          <div class="auth-field">
            <label for="username" class="auth-label">Email</label>
            <input type="email" id="username" name="username" required autofocus autocomplete="email"
                   class="auth-input">
          </div>
          <div class="auth-field">
            <label for="password" class="auth-label">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password"
                   class="auth-input">
          </div>
          <label class="auth-remember">
            <input type="checkbox" name="remember-me">
            <span>Remember me for 30 days</span>
          </label>
          <button type="submit"
                  class="app-button-primary auth-submit">
            Sign in
          </button>
        </form>
      </div>

      <div class="auth-attribution">
        <img src="/brand/dynamiq-horizontal.svg" th:src="@{/brand/dynamiq-horizontal.svg}" alt="Dynamiq Solutions" />
        <p>Internal tool · Dynamiq Solutions</p>
      </div>
    </div>
  </body>
</html>
