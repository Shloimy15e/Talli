<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

  <head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' — Talli'">Talli</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
      body { font-family: 'Inter', sans-serif; }
      .portal-add-button {
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        height: 2rem;
        padding: 0 0.625rem;
        border: 1px solid #fed7aa;
        border-radius: 0.375rem;
        background: #fff7ed;
        color: #c05621;
        font-size: 0.75rem;
        font-weight: 600;
        line-height: 1;
        transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease;
      }
      .portal-add-button:hover {
        border-color: #fb923c;
        background: #ffedd5;
        color: #9a3412;
      }
      .portal-add-button svg {
        width: 0.875rem;
        height: 0.875rem;
      }
      .portal-icon-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2rem;
        height: 2rem;
        border: 1px solid transparent;
        border-radius: 0.375rem;
        color: #94a3b8;
        transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease;
      }
      .portal-icon-button:hover {
        border-color: #fecaca;
        background: #fef2f2;
        color: #dc2626;
      }
      .portal-add-button:focus-visible,
      .portal-icon-button:focus-visible {
        outline: 2px solid #ea7c28;
        outline-offset: 2px;
      }
      .portal-icon-button svg {
        width: 1rem;
        height: 1rem;
      }
    </style>
  </head>

  <body th:fragment="portal(content)">
    <div class="min-h-screen bg-slate-100 w-full">

      <!-- Top bar -->
      <header class="bg-[#161f30] text-white">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <img src="/logo.svg" alt="Talli" class="w-6 h-6"/>
            <span class="font-semibold">Talli</span>
          </div>
          <div class="flex items-center gap-4">
            <a href="/portal/statement" class="text-xs text-slate-300 hover:text-white">Download Statement</a>
            <form th:action="@{/logout}" method="post">
              <button type="submit" class="text-xs text-slate-400 hover:text-white">Sign out</button>
            </form>
          </div>
        </div>
      </header>

      <!-- Content -->
      <main class="max-w-7xl mx-auto px-6 py-8">
        <th:block th:replace="${content}"></th:block>
      </main>

    </div>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        if (window.lucide) window.lucide.createIcons();
      });
    </script>
  </body>

</html>
