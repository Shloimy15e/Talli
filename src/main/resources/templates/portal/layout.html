<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

  <head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' — Talli'">Talli</title>
    <link rel="icon" href="/brand/talli-favicon.svg" th:href="@{/brand/talli-favicon.svg}" type="image/svg+xml" sizes="16x16"/>
    <link rel="icon" href="/brand/talli-favicon-stamped.svg" th:href="@{/brand/talli-favicon-stamped.svg}" type="image/svg+xml" sizes="32x32 48x48"/>
    <link rel="stylesheet" href="/css/design-tokens.css"/>
    <link rel="stylesheet" href="/css/app.css"/>
    <link rel="stylesheet" href="/css/ui/select.css"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/ui/theme.js"></script>
    <script defer src="/js/ui/select.js"></script>
    <script defer src="/js/app-shell.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
      .portal-add-button {
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        height: 2rem;
        padding: 0 0.625rem;
        border: 1px solid var(--ui-line);
        border-radius: 0.375rem;
        background: var(--ui-selected);
        color: var(--ui-accent-ink);
        font-size: 0.75rem;
        font-weight: 600;
        line-height: 1;
        transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease;
      }
      .portal-add-button:hover {
        border-color: var(--ui-accent);
        background: var(--ui-selection);
        color: var(--ui-accent-ink);
      }
      .portal-add-button svg {
        width: 0.875rem;
        height: 0.875rem;
      }
      .portal-icon-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2rem;
        height: 2rem;
        border: 1px solid transparent;
        border-radius: 0.375rem;
        color: #94a3b8;
        transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease;
      }
      .portal-icon-button:hover {
        border-color: #fecaca;
        background: #fef2f2;
        color: #dc2626;
      }
      .portal-add-button:focus-visible,
      .portal-icon-button:focus-visible {
        outline: 2px solid var(--ui-focus);
        outline-offset: 2px;
      }
      .portal-icon-button svg {
        width: 1rem;
        height: 1rem;
      }
    </style>
  </head>

  <body th:fragment="portal(content)" class="portal-app">
    <div class="min-h-screen bg-slate-100 w-full">

      <!-- Top bar -->
      <header class="bg-ui-rail text-white">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <img src="/brand/talli-wordmark-reverse.svg" th:src="@{/brand/talli-wordmark-reverse.svg}" alt="Talli" width="184" height="48" class="h-8 w-auto"/>
          </div>
          <div class="flex items-center gap-4">
            <a th:href="@{${(portalBase ?: '/portal') + '/statement'}}" class="text-xs text-ui-rail-ink hover:text-white">Download Statement</a>
            <form th:action="@{/logout}" method="post">
              <button type="submit" class="text-xs text-ui-rail-ink hover:text-white">Sign out</button>
            </form>
          </div>
        </div>
      </header>

      <div th:if="${portalPreview == true}" class="max-w-7xl mx-auto px-6 pt-5 flex flex-wrap items-center justify-between gap-2 text-sm text-slate-500">
        <span>Portal preview · <span th:text="${previewClient.name}">Client</span> · View only</span>
        <a th:href="@{/clients/{id}(id=${previewClient.id})}" class="text-ui-accent-ink hover:underline">Back to client</a>
      </div>

      <!-- Content -->
      <main class="ui-surface-content max-w-7xl mx-auto px-6 py-8">
        <th:block th:replace="${content}"></th:block>
      </main>
      <footer class="pb-8 text-center"><img src="/brand/dynamiq-horizontal.svg" alt="Dynamiq" class="w-28 h-auto mx-auto"/></footer>

    </div>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        if (window.lucide) window.lucide.createIcons();
      });
    </script>
  </body>

</html>
