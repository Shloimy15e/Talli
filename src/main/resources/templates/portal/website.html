<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{portal/layout :: head(${project.name + ' Website'})}"></head>
  <body th:replace="~{portal/layout :: portal(~{::main})}">
    <main>
      <div class="mb-6 flex items-start justify-between gap-4">
        <div>
          <a th:href="@{/portal}" class="text-xs text-slate-500 hover:text-slate-900">Back to portal</a>
          <h1 class="text-2xl font-semibold tracking-tight mt-2" th:text="${project.name} + ' Website'">Website</h1>
          <a th:if="${project.websitePublicUrl}" th:href="${project.websitePublicUrl}" target="_blank"
             class="inline-flex text-sm text-[#ea7c28] hover:underline mt-1">View live site</a>
        </div>
        <div class="text-right text-xs text-slate-500">
          <p th:if="${project.lastPublishAt != null}">
            Last published <span th:text="${#temporals.format(project.lastPublishAt, 'MMM d, yyyy h:mm a')}">May 1</span>
          </p>
          <p th:if="${project.lastPublishSha != null}" class="font-mono" th:text="${project.lastPublishSha}">abc123</p>
        </div>
      </div>

      <div th:if="${success}" class="mb-4 p-3 bg-emerald-50 border border-emerald-200 rounded-lg text-sm text-emerald-700"
           th:text="${success}">Saved.</div>
      <div th:if="${error}" class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700"
           th:text="${error}">Error.</div>

      <form th:action="${_csrf == null} ? @{/portal/projects/{id}/website(id=${project.id})} : @{/portal/projects/{id}/website(id=${project.id}, _csrf=${_csrf.token})}" method="post" enctype="multipart/form-data"
            class="space-y-6">
        <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
          <div class="px-6 py-4 border-b border-slate-200">
            <h2 class="text-sm font-semibold">Home</h2>
          </div>
          <div class="p-6 grid grid-cols-2 gap-4">
            <label class="block">
              <span class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Hero headline</span>
              <input name="homeHeroHeadline" th:value="${form.homeHeroHeadline}" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
            </label>
            <label class="block">
              <span class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Hero subheadline</span>
              <input name="homeHeroSubheadline" th:value="${form.homeHeroSubheadline}" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
            </label>
            <label class="block col-span-2">
              <span class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Hero text</span>
              <textarea name="homeHeroText" rows="3" th:text="${form.homeHeroText}" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg"></textarea>
            </label>
            <label class="block">
              <span class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Approach title</span>
              <input name="homeApproachTitle" th:value="${form.homeApproachTitle}" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
            </label>
            <label class="block">
              <span class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Approach intro</span>
              <input name="homeApproachIntro" th:value="${form.homeApproachIntro}" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
            </label>
            <div class="col-span-2 grid grid-cols-3 gap-3" th:each="pillar, stat : ${form.homePillars}">
              <input th:name="'homePillarNumber_' + ${stat.index}" th:value="${pillar.number}" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
              <input th:name="'homePillarTitle_' + ${stat.index}" th:value="${pillar.title}" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
              <input th:name="'homePillarDescription_' + ${stat.index}" th:value="${pillar.description}" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
            </div>
            <label class="block">
              <span class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Philosophy title</span>
              <input name="homePhilosophyTitle" th:value="${form.homePhilosophyTitle}" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
            </label>
            <label class="block">
              <span class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Expertise title</span>
              <input name="homeExpertiseTitle" th:value="${form.homeExpertiseTitle}" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
            </label>
            <label class="block col-span-2">
              <span class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Philosophy paragraphs</span>
              <textarea name="homePhilosophyParagraphs" rows="4" th:text="${form.homePhilosophyParagraphs}" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg"></textarea>
            </label>
            <label class="block">
              <span class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Expertise subtitle</span>
              <input name="homeExpertiseSubtitle" th:value="${form.homeExpertiseSubtitle}" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
            </label>
            <div class="space-y-2">
              <label th:each="category, stat : ${form.homeExpertiseCategories}" class="block">
                <span class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2" th:text="'Expertise ' + (${stat.index} + 1)">Expertise</span>
                <input th:name="'homeExpertiseTitle_' + ${stat.index}" th:value="${category.title}" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
              </label>
            </div>
            <div class="col-span-2 grid grid-cols-2 gap-4">
              <div>
                <p class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Highlights image</p>
                <img th:if="${form.homeHighlightsImage}" th:src="${@websiteAssetUrls.src(project, form.homeHighlightsImage)}" class="h-32 w-full object-cover rounded-lg border border-slate-200 mb-2" alt="">
                <input type="file" name="homeHighlightsImage" accept="image/jpeg,image/png,image/webp" class="w-full text-xs">
              </div>
              <div>
                <p class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Impact image</p>
                <img th:if="${form.homeImpactShowcaseImage}" th:src="${@websiteAssetUrls.src(project, form.homeImpactShowcaseImage)}" class="h-32 w-full object-cover rounded-lg border border-slate-200 mb-2" alt="">
                <input type="file" name="homeImpactShowcaseImage" accept="image/jpeg,image/png,image/webp" class="w-full text-xs">
              </div>
            </div>
          </div>
        </section>

        <section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
          <div class="px-6 py-4 border-b border-slate-200">
            <h2 class="text-sm font-semibold">About</h2>
          </div>
          <div class="p-6 grid grid-cols-2 gap-4">
            <input name="aboutHeading" th:value="${form.aboutHeading}" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
            <input name="aboutCompanyName" th:value="${form.aboutCompanyName}" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
            <input name="aboutIntroTitle" th:value="${form.aboutIntroTitle}" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
            <input name="aboutFounderName" th:value="${form.aboutFounderName}" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
            <input name="aboutFounderTitle" th:value="${form.aboutFounderTitle}" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
            <div>
              <img th:if="${form.aboutFounderImage}" th:src="${@websiteAssetUrls.src(project, form.aboutFounderImage)}" class="h-24 w-24 object-cover rounded-lg border border-slate-200 mb-2" alt="">
              <input type="file" name="aboutFounderImage" accept="image/jpeg,image/png,image/webp" class="w-full text-xs">
            </div>
            <textarea name="aboutIntroParagraphs" rows="4" th:text="${form.aboutIntroParagraphs}" class="col-span-2 px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg"></textarea>
            <textarea name="aboutFounderBio" rows="4" th:text="${form.aboutFounderBio}" class="col-span-2 px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg"></textarea>
            <div class="col-span-2 grid grid-cols-2 gap-3" th:each="value, stat : ${form.aboutValues}">
              <input th:name="'aboutValueName_' + ${stat.index}" th:value="${value.name}" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
              <input th:name="'aboutValueDescription_' + ${stat.index}" th:value="${value.description}" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
            </div>
            <input name="aboutWhatSetsUsApartTitle" th:value="${form.aboutWhatSetsUsApartTitle}" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
            <input name="aboutChoosingNorthlightTitle" th:value="${form.aboutChoosingNorthlightTitle}" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
            <textarea name="aboutWhatSetsUsApartContent" rows="3" th:text="${form.aboutWhatSetsUsApartContent}" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg"></textarea>
            <textarea name="aboutChoosingNorthlightContent" rows="3" th:text="${form.aboutChoosingNorthlightContent}" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg"></textarea>
          </div>
        </section>

        <section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
          <div class="px-6 py-4 border-b border-slate-200">
            <h2 class="text-sm font-semibold">Services</h2>
          </div>
          <div class="p-6 space-y-4">
            <div class="grid grid-cols-2 gap-4">
              <input name="servicesIntroTitle" th:value="${form.servicesIntroTitle}" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
              <input name="servicesIntroSubtitle" th:value="${form.servicesIntroSubtitle}" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
              <textarea name="servicesIntroParagraph" rows="3" th:text="${form.servicesIntroParagraph}" class="col-span-2 px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg"></textarea>
            </div>
            <div th:each="service, stat : ${form.services}" class="grid grid-cols-12 gap-3 border-t border-slate-100 pt-4">
              <input th:name="'serviceTitle_' + ${stat.index}" th:value="${service.title}" class="col-span-4 px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
              <input th:name="'serviceDescription_' + ${stat.index}" th:value="${service.description}" class="col-span-5 px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
              <div class="col-span-3">
                <img th:if="${service.image}" th:src="${@websiteAssetUrls.src(project, service.image)}" class="h-16 w-full object-cover rounded border border-slate-200 mb-2" alt="">
                <input type="file" th:name="'serviceImage_' + ${stat.index}" accept="image/jpeg,image/png,image/webp" class="w-full text-xs">
              </div>
            </div>
          </div>
        </section>

        <section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
          <div class="px-6 py-4 border-b border-slate-200">
            <h2 class="text-sm font-semibold">Transactions</h2>
          </div>
          <div class="p-6 space-y-4">
            <div class="grid grid-cols-2 gap-4">
              <input name="transactionsHeading" th:value="${form.transactionsHeading}" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
              <input name="transactionsSubheading" th:value="${form.transactionsSubheading}" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
            </div>
            <div th:each="tx, txStat : ${form.transactions}" class="border-t border-slate-100 pt-4 space-y-3">
              <div class="grid grid-cols-2 gap-3">
                <input th:name="'transactionLocation_' + ${txStat.index}" th:value="${tx.location}" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
                <input th:name="'transactionUnits_' + ${txStat.index}" th:value="${tx.units}" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
              </div>
              <div class="grid grid-cols-3 gap-3">
                <div th:each="image, imageStat : ${tx.images}">
                  <img th:if="${image}" th:src="${@websiteAssetUrls.src(project, image)}" class="h-20 w-full object-cover rounded border border-slate-200 mb-2" alt="">
                  <input type="file" th:name="'transactionImage_' + ${txStat.index} + '_' + ${imageStat.index}" accept="image/jpeg,image/png,image/webp" class="w-full text-xs">
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
          <div class="px-6 py-4 border-b border-slate-200">
            <h2 class="text-sm font-semibold">Contact</h2>
          </div>
          <div class="p-6 grid grid-cols-2 gap-4">
            <input name="contactHeading" th:value="${form.contactHeading}" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
            <input name="contactEmail" th:value="${form.contactEmail}" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
            <textarea name="contactText" rows="3" th:text="${form.contactText}" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg"></textarea>
            <textarea name="contactSubtext" rows="3" th:text="${form.contactSubtext}" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg"></textarea>
            <input name="contactAddress" th:value="${form.contactAddress}" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
            <input name="contactCopyright" th:value="${form.contactCopyright}" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg">
          </div>
        </section>

        <div class="sticky bottom-0 bg-slate-100/95 border-t border-slate-200 py-4 flex justify-end">
          <button type="submit" class="bg-[#ea7c28] hover:bg-[#d66f20] text-white text-sm font-medium px-5 py-2 rounded-lg">
            Publish changes
          </button>
        </div>
      </form>
    </main>
  </body>
</html>
