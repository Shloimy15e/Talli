<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <body>
    <th:block th:fragment="sidebar(active)">
      <header class="app-mobile-header">
        <button type="button"
                class="app-mobile-nav-toggle"
                data-app-sidebar-open
                aria-controls="app-sidebar"
                aria-expanded="false"
                aria-label="Open navigation"
                title="Open navigation">
          <i data-lucide="menu"></i>
        </button>
        <a th:href="@{/dashboard}" class="app-mobile-brand" aria-label="Talli dashboard">
          <img src="/logo.svg" th:src="@{/logo.svg}" alt="" />
          <span>Talli</span>
        </a>
      </header>

      <button type="button"
              class="app-sidebar-backdrop"
              data-app-sidebar-close
              aria-label="Close navigation"
              tabindex="-1"></button>

      <aside id="app-sidebar" class="app-sidebar" aria-label="Workspace navigation">
        <div class="app-sidebar-header">
          <a th:href="@{/dashboard}"
             class="app-sidebar-brand"
             aria-label="Talli dashboard"
             title="Talli dashboard"
             data-tippy-content="Talli dashboard">
            <img src="/logo.svg" th:src="@{/logo.svg}" alt="" />
            <span>Talli</span>
          </a>
          <button type="button"
                  class="app-sidebar-collapse"
                  data-app-sidebar-collapse
                  aria-controls="app-sidebar"
                  aria-expanded="true"
                  aria-label="Collapse navigation"
                  title="Collapse navigation"
                  data-tippy-content="Collapse navigation">
            <i data-lucide="panel-left-close" class="app-collapse-icon-expanded"></i>
            <i data-lucide="panel-left-open" class="app-collapse-icon-collapsed"></i>
          </button>
        </div>

        <div class="app-sidebar-navigation">
        <section class="app-nav-section" aria-labelledby="workspace-navigation-heading">
          <h2 id="workspace-navigation-heading" class="app-nav-section-title">Workspace</h2>
          <nav class="app-nav-list" aria-label="Workspace">
            <a sec:authorize="hasAuthority('view-dashboard')" th:href="@{/dashboard}"
               th:classappend="${active == 'dashboard'} ? 'is-active'"
               th:attr="aria-current=${active == 'dashboard'} ? 'page' : null"
               class="app-nav-link" aria-label="Dashboard" title="Dashboard" data-tippy-content="Dashboard">
              <i data-lucide="layout-dashboard" class="app-nav-icon"></i><span class="app-nav-label">Dashboard</span>
            </a>
            <a sec:authorize="hasAuthority('view-clients')" th:href="@{/clients}"
               th:classappend="${active == 'clients'} ? 'is-active'"
               th:attr="aria-current=${active == 'clients'} ? 'page' : null"
               class="app-nav-link" aria-label="Clients" title="Clients" data-tippy-content="Clients">
              <i data-lucide="users" class="app-nav-icon"></i><span class="app-nav-label">Clients</span>
            </a>
            <a sec:authorize="hasAuthority('view-projects')" th:href="@{/projects}"
               th:classappend="${active == 'projects'} ? 'is-active'"
               th:attr="aria-current=${active == 'projects'} ? 'page' : null"
               class="app-nav-link" aria-label="Projects" title="Projects" data-tippy-content="Projects">
              <i data-lucide="folder-kanban" class="app-nav-icon"></i><span class="app-nav-label">Projects</span>
            </a>
            <a sec:authorize="hasAuthority('view-time')" th:href="@{/time}"
               th:classappend="${active == 'time'} ? 'is-active'"
               th:attr="aria-current=${active == 'time'} ? 'page' : null"
               class="app-nav-link" aria-label="Time" title="Time" data-tippy-content="Time">
              <i data-lucide="clock" class="app-nav-icon"></i><span class="app-nav-label">Time</span>
            </a>
            <a sec:authorize="hasAuthority('view-invoices')" th:href="@{/invoices}"
               th:classappend="${active == 'invoices'} ? 'is-active'"
               th:attr="aria-current=${active == 'invoices'} ? 'page' : null"
               class="app-nav-link" aria-label="Invoices" title="Invoices" data-tippy-content="Invoices">
              <i data-lucide="file-text" class="app-nav-icon"></i><span class="app-nav-label">Invoices</span>
            </a>
            <a sec:authorize="hasAuthority('view-expenses')" th:href="@{/expenses}"
               th:classappend="${active == 'expenses'} ? 'is-active'"
               th:attr="aria-current=${active == 'expenses'} ? 'page' : null"
               class="app-nav-link" aria-label="Expenses" title="Expenses" data-tippy-content="Expenses">
              <i data-lucide="receipt" class="app-nav-icon"></i><span class="app-nav-label">Expenses</span>
            </a>
            <a sec:authorize="hasAuthority('view-expenses')" th:href="@{/subscriptions}"
               th:classappend="${active == 'subscriptions'} ? 'is-active'"
               th:attr="aria-current=${active == 'subscriptions'} ? 'page' : null"
               class="app-nav-link" aria-label="Subscriptions" title="Subscriptions" data-tippy-content="Subscriptions">
              <i data-lucide="repeat" class="app-nav-icon"></i><span class="app-nav-label">Subscriptions</span>
            </a>
            <a sec:authorize="hasRole('admin')" th:href="@{/emails}"
               th:classappend="${active == 'emails'} ? 'is-active'"
               th:attr="aria-current=${active == 'emails'} ? 'page' : null"
               class="app-nav-link" aria-label="Mail" title="Mail" data-tippy-content="Mail">
              <i data-lucide="mail" class="app-nav-icon"></i><span class="app-nav-label">Mail</span>
            </a>
            <a sec:authorize="hasAuthority('view-reports')" th:href="@{/reports}"
               th:classappend="${active == 'reports'} ? 'is-active'"
               th:attr="aria-current=${active == 'reports'} ? 'page' : null"
               class="app-nav-link" aria-label="Reports" title="Reports" data-tippy-content="Reports">
              <i data-lucide="bar-chart-3" class="app-nav-icon"></i><span class="app-nav-label">Reports</span>
            </a>
          </nav>
        </section>

        <section sec:authorize="hasAuthority('manage-users')" class="app-nav-section" aria-labelledby="admin-navigation-heading">
          <h2 id="admin-navigation-heading" class="app-nav-section-title">Administration</h2>
          <nav class="app-nav-list" aria-label="Administration">
            <a th:href="@{/admin/users}"
               th:classappend="${active == 'users'} ? 'is-active'"
               th:attr="aria-current=${active == 'users'} ? 'page' : null"
               class="app-nav-link" aria-label="Users" title="Users" data-tippy-content="Users">
              <i data-lucide="shield" class="app-nav-icon"></i><span class="app-nav-label">Users</span>
            </a>
            <a th:href="@{/emails/senders}"
               th:classappend="${active == 'sender-profiles'} ? 'is-active'"
               th:attr="aria-current=${active == 'sender-profiles'} ? 'page' : null"
               class="app-nav-link" aria-label="Sender profiles" title="Sender profiles" data-tippy-content="Sender profiles">
              <i data-lucide="at-sign" class="app-nav-icon"></i><span class="app-nav-label">Senders</span>
            </a>
            <a th:href="@{/admin/import}"
               th:classappend="${active == 'import'} ? 'is-active'"
               th:attr="aria-current=${active == 'import'} ? 'page' : null"
               class="app-nav-link" aria-label="Import" title="Import" data-tippy-content="Import">
              <i data-lucide="upload" class="app-nav-icon"></i><span class="app-nav-label">Import</span>
            </a>
            <a th:href="@{/admin/migration}"
               th:classappend="${active == 'migration'} ? 'is-active'"
               th:attr="aria-current=${active == 'migration'} ? 'page' : null"
               class="app-nav-link" aria-label="Migration" title="Migration" data-tippy-content="Migration">
              <i data-lucide="database" class="app-nav-icon"></i><span class="app-nav-label">Migration</span>
            </a>
          </nav>
        </section>
        </div>

        <footer class="app-sidebar-footer">
          <a th:href="@{/profile}"
             th:classappend="${active == 'profile'} ? 'is-active'"
             th:attr="aria-current=${active == 'profile'} ? 'page' : null"
             class="app-nav-link" aria-label="Profile" title="Profile" data-tippy-content="Profile">
            <i data-lucide="circle-user-round" class="app-nav-icon"></i><span class="app-nav-label">Profile</span>
          </a>
          <form th:action="@{/logout}" method="post">
            <button type="submit" class="app-nav-action" aria-label="Sign out" title="Sign out" data-tippy-content="Sign out">
              <i data-lucide="log-out" class="app-nav-icon"></i><span class="app-nav-label">Sign out</span>
            </button>
          </form>
          <p class="app-sidebar-version">Talli v2.0.0</p>
        </footer>
      </aside>
    </th:block>
  </body>
</html>
