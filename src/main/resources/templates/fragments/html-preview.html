<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <th:block th:fragment="dialog">
      <dialog id="html-preview-dialog"
              data-html-preview-dialog
              aria-labelledby="html-preview-heading"
              class="html-preview-dialog m-auto w-[min(680px,calc(100vw-2rem))] max-w-none overflow-hidden rounded-2xl border border-slate-200 bg-white p-0 text-slate-900 shadow-2xl backdrop:bg-slate-950/45">
        <div class="flex max-h-[calc(100vh-2rem)] flex-col">
          <div class="flex items-start justify-between gap-5 border-b border-slate-200 px-5 py-4 sm:px-6">
            <div class="min-w-0">
              <h2 id="html-preview-heading" data-html-preview-heading class="text-base font-semibold">HTML preview</h2>
              <p data-html-preview-subtitle class="mt-0.5 truncate text-sm text-slate-500"></p>
            </div>
            <button type="button" data-html-preview-close aria-label="Close preview"
                    class="-mr-2 inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-xl text-slate-400 hover:bg-slate-100 hover:text-slate-700 focus:outline-none focus:ring-2 focus:ring-ui-accent/40">
              <i data-lucide="x" class="h-4 w-4"></i>
            </button>
          </div>
          <div class="min-h-0 bg-slate-100 p-3 sm:p-5">
            <iframe sandbox="" referrerpolicy="no-referrer" data-html-preview-frame
                    title="HTML preview"
                    class="block h-[min(440px,calc(100vh-9rem))] w-full rounded-xl border border-slate-200 bg-white shadow-sm"></iframe>
          </div>
        </div>
      </dialog>
      <style>
        .html-preview-dialog {
          opacity: 0;
          transform: translateY(8px) scale(0.985);
          transition: opacity 180ms ease, transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1),
            overlay 180ms allow-discrete, display 180ms allow-discrete;
        }
        .html-preview-dialog::backdrop {
          opacity: 0;
          transition: opacity 180ms ease, overlay 180ms allow-discrete, display 180ms allow-discrete;
        }
        .html-preview-dialog[open] { opacity: 1; transform: translateY(0) scale(1); }
        .html-preview-dialog[open]::backdrop { opacity: 1; }
        .html-preview-dialog[data-closing] { opacity: 0; transform: translateY(8px) scale(0.985); }
        .html-preview-dialog[data-closing]::backdrop { opacity: 0; }
        @starting-style {
          .html-preview-dialog[open] { opacity: 0; transform: translateY(8px) scale(0.985); }
          .html-preview-dialog[open]::backdrop { opacity: 0; }
        }
        @media (prefers-reduced-motion: reduce) {
          .html-preview-dialog,
          .html-preview-dialog::backdrop { transition: none; }
        }
      </style>
    </th:block>
  </body>
</html>
