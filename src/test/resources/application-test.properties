spring.datasource.url=jdbc:h2:mem:talli_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

spring.main.banner-mode=off
spring.thymeleaf.cache=false

app.storage.driver=local
app.storage.local.path=${java.io.tmpdir}/talli-test-media
app.mail.resend.api-key=
app.mail.resend.webhook-secret=
app.github.app-id=
app.github.private-key=
app.seed.enabled=false
